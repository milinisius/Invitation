name: Publish invitation to gh-pages

# GitHub Pages serves this repo from the gh-pages branch, so publishing is just
# a matter of keeping that branch level with the working branch. (The Actions
# deployment source was not an option here: creating the Pages site needs admin
# rights that GITHUB_TOKEN does not have, so the site was enabled by pushing
# gh-pages instead — which GitHub picks up automatically.)

on:
  push:
    branches: [claude/spiderman-movie-invite-eaman9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gh-pages is a pure deploy mirror, so replace its tip with a single
      # commit holding just the files the site actually serves. (A plain push
      # cannot work here: checkout is shallow, so git has no gh-pages history
      # to fast-forward against.)
      - name: Publish site files to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github tools
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Publish ${GITHUB_SHA}"
          git push --force origin gh-pages-tmp:gh-pages
